name: Build app packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - &setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - &setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - run: dart analyze --fatal-infos lib test
        continue-on-error: true
      # 测试当前不阻塞出包（开发优先、集中验证暂缓），结果仍会显示在运行详情里。
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "只能从 main 分支手动发布，当前为 $GITHUB_REF。" >&2
            exit 1
          fi
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "pubspec.yaml 缺少 version。" >&2
            exit 1
          fi
          tag="app-v${version//+/-}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || gh release view "$tag" >/dev/null 2>&1; then
            echo "版本 $version（$tag）已发布过，请先提升 pubspec.yaml 的 version。" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

    tvos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    strategy: *editions
    steps:
      - uses: actions/checkout@v4
      - *setup-python
      - *setup-go
      - name: Check Xcode and Go
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-path
          xcrun --sdk appletvos --find clang
          go version
      - name: Build unsigned tvOS packages
        run: python scripts/build_tvos.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-tvos-unsigned
          path: dist/tvos/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [checks, prepare, tvos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          版本 ${VERSION}。两个版本功能相同，区别只在站源范围，按需选择：

          - 红果鉴 hongguojian：仅红果站源
          - 真果鉴 zhenguojian：全部站源

          tvOS（Apple TV）：
          - *-tvos-unsigned.ipa：未签名 IPA，需在 Mac 上用 Xcode 签名后安装到 Apple TV

          签名证书 SHA-256：${ANDROID_CERT_SHA256}
          EOF
          changes="$(awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md)"
          if [ -n "$changes" ]; then
            { printf '更新内容：\n\n%s\n\n' "$changes"; cat notes.md; } > notes.tmp
            mv notes.tmp notes.md
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "红果鉴 / 真果鉴 ${VERSION}" --notes-file notes.md
